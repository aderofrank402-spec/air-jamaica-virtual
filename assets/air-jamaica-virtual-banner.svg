  <g transform="translate(920 235) rotate(-18)"><path d="M0 27 L92 0 L104 7 L71 30 L112 51 L101 58 L54 40 L28 59 L19 55 L31 36 L0 33 Z" fill="#fff"/><path d="M48 31L91 15" stroke="#f5c842" stroke-width="4"/></g>
