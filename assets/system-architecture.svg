<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Air Jamaica Virtual flight lifecycle</title><desc id="desc">Pilots and staff use web and flight clients connected to application services, operational data, events, queues, and aviation integrations.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07140d"/><stop offset="1" stop-color="#122b1d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38d477"/></marker><style>.h{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#fff}.s{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#a8c4b3}.l{font:650 17px 'Segoe UI',Arial,sans-serif;fill:#fff;text-anchor:middle}.d{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#aac4b4;text-anchor:middle}.c{fill:#102d1d;stroke:#2f7450;stroke-width:1.5}.x{fill:#3a2b0b;stroke:#f5c842;stroke-width:1.7}.lne{fill:none;stroke:#38d477;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="500" rx="22" fill="url(#bg)"/><text x="52" y="55" class="h">Flight lifecycle and system boundaries</text><text x="52" y="81" class="s">One operational record connects pilot intent, flight execution, reporting, and staff review.</text>
  <path class="lne" d="M225 180H285M485 180H545M745 180H805M1005 180H1065"/><path class="lne" d="M645 230V335M905 230V335M1150 230V335H1035"/>
  <rect x="45" y="130" width="180" height="100" rx="14" class="c"/><text x="135" y="171" class="l">Pilots and staff</text><text x="135" y="197" class="d">Web and flight clients</text>
  <rect x="285" y="130" width="200" height="100" rx="14" class="x"/><text x="385" y="171" class="l">Routes and access</text><text x="385" y="197" class="d">Validation · permissions</text>
  <rect x="545" y="130" width="200" height="100" rx="14" class="c"/><text x="645" y="171" class="l">Domain services</text><text x="645" y="197" class="d">Flight · fleet · pilots</text>
  <rect x="805" y="130" width="200" height="100" rx="14" class="x"/><text x="905" y="171" class="l">Events and queues</text><text x="905" y="197" class="d">Async consequences</text>
  <rect x="1065" y="130" width="170" height="100" rx="14" class="c"/><text x="1150" y="171" class="l">Integrations</text><text x="1150" y="197" class="d">Weather · maps · mail</text>
  <rect x="545" y="335" width="200" height="92" rx="14" class="c"/><text x="645" y="373" class="l">Operational data</text><text x="645" y="399" class="d">Relational domain state</text>
  <rect x="805" y="335" width="230" height="92" rx="14" class="c"/><text x="920" y="373" class="l">Operations</text><text x="920" y="399" class="d">Logs · backups · health</text>
</svg>
